<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GiggleVault - Funny Media Hub</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="logo">
      <span class="logo-icon">😂</span>
      <span class="logo-text">GiggleVault</span>
    </div>

    <div class="nav-controls">
      <!-- Language Selector -->
      <select id="languageSelect" onchange="changeLanguage(this.value)">
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="ar">العربية</option>
      </select>

      <!-- Visitor Suggest Button -->
      <button class="btn btn-secondary" onclick="openModal('suggestModal')" data-i18n="suggestBtn">
        💡 Suggest Media
      </button>

      <!-- Admin Panel Toggle -->
      <button class="btn btn-primary" id="adminToggleBtn" onclick="openAdmin()" data-i18n="adminBtn">
        🔒 Admin
      </button>
    </div>
  </header>

  <!-- Filter & Search Bar -->
  <section class="filters-container">
    <div class="filter-group">
      <label data-i18n="categoryLabel">Category:</label>
      <select id="filterCategory" onchange="onCategoryFilterChange()">
        <option value="all" data-i18n="all">All</option>
      </select>
    </div>

    <div class="filter-group">
      <label data-i18n="subCategoryLabel">Sub-category:</label>
      <select id="filterSubCategory" onchange="renderFeed()">
        <option value="all" data-i18n="all">All</option>
      </select>
    </div>

    <div class="filter-group">
      <label data-i18n="mediaTypeLabel">Media Type:</label>
      <select id="filterMediaType" onchange="renderFeed()">
        <option value="all" data-i18n="all">All</option>
        <option value="image" data-i18n="images">Images / GIFs</option>
        <option value="video" data-i18n="videos">Videos</option>
      </select>
    </div>
  </section>

  <!-- Gallery Grid -->
  <main class="feed-grid" id="mediaFeed">
    <!-- Media items render here -->
  </main>

  <!-- MODAL: Visitor Suggestion -->
  <div class="modal-overlay" id="suggestModal">
    <div class="modal">
      <div class="modal-header">
        <h3 data-i18n="suggestTitle">Share Funny Content</h3>
        <button class="close-btn" onclick="closeModal('suggestModal')">&times;</button>
      </div>
      <form id="suggestForm" onsubmit="handleUserSuggestion(event)">
        <label data-i18n="titleInput">Title / Caption</label>
        <input type="text" id="suggestTitleInput" required placeholder="Look at this cat!">

        <label data-i18n="urlInput">Link to Image/Video/YouTube</label>
        <input type="url" id="suggestUrlInput" required placeholder="https://example.com/meme.jpg">

        <label data-i18n="categoryLabel">Category</label>
        <select id="suggestCategorySelect" required></select>

        <label data-i18n="typeInput">Format</label>
        <select id="suggestTypeSelect">
          <option value="image" data-i18n="images">Image</option>
          <option value="video" data-i18n="videos">Video</option>
        </select>

        <button type="submit" class="btn btn-primary full-width" data-i18n="submitBtn">Send for Review</button>
      </form>
    </div>
  </div>

  <!-- MODAL: Admin Login -->
  <div class="modal-overlay" id="adminLoginModal">
    <div class="modal">
      <div class="modal-header">
        <h3 data-i18n="adminLogin">Admin Verification</h3>
        <button class="close-btn" onclick="closeModal('adminLoginModal')">&times;</button>
      </div>
      <form onsubmit="handleAdminLogin(event)">
        <p class="hint">Default passcode: <code>admin123</code></p>
        <input type="password" id="adminPasswordInput" placeholder="Enter Admin Password" required>
        <button type="submit" class="btn btn-primary full-width" data-i18n="login">Log In</button>
      </form>
    </div>
  </div>

  <!-- MODAL: Admin Dashboard -->
  <div class="modal-overlay" id="adminDashboardModal">
    <div class="modal wide">
      <div class="modal-header">
        <h3 data-i18n="adminDashboard">Admin Dashboard</h3>
        <button class="close-btn" onclick="closeModal('adminDashboardModal')">&times;</button>
      </div>
      
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('addMediaTab')">Add Media</button>
        <button class="tab-btn" onclick="switchTab('categoriesTab')">Categories</button>
        <button class="tab-btn" onclick="switchTab('submissionsTab')">
          Submissions (<span id="submissionCount">0</span>)
        </button>
      </div>

      <!-- Tab 1: Add Content -->
      <div class="tab-content" id="addMediaTab">
        <form onsubmit="handleAdminAddMedia(event)">
          <div class="grid-2">
            <div>
              <label>Title</label>
              <input type="text" id="adminTitle" required>
            </div>
            <div>
              <label>Media Link (Image or Video URL / YouTube)</label>
              <input type="url" id="adminUrl" required>
            </div>
          </div>
          <div class="grid-3">
            <div>
              <label>Media Type</label>
              <select id="adminType">
                <option value="image">Image / GIF</option>
                <option value="video">Video</option>
              </select>
            </div>
            <div>
              <label>Category</label>
              <select id="adminCat" onchange="populateAdminSubcategories()"></select>
            </div>
            <div>
              <label>Sub-category</label>
              <select id="adminSubcat"></select>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" style="margin-top: 15px;">Publish to Site</button>
        </form>
      </div>

      <!-- Tab 2: Manage Categories -->
      <div class="tab-content hidden" id="categoriesTab">
        <h4>Create New Category</h4>
        <div class="inline-form">
          <input type="text" id="newCatInput" placeholder="e.g. Animals">
          <button class="btn btn-secondary" onclick="addCategory()">Add Category</button>
        </div>

        <h4 style="margin-top: 20px;">Add Sub-Category</h4>
        <div class="inline-form">
          <select id="parentCatSelect"></select>
          <input type="text" id="newSubCatInput" placeholder="e.g. Dogs">
          <button class="btn btn-secondary" onclick="addSubCategory()">Add Sub-Category</button>
        </div>
      </div>

      <!-- Tab 3: Submissions -->
      <div class="tab-content hidden" id="submissionsTab">
        <div id="submissionsList" class="submission-list">
          <!-- Pending items injected here -->
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
